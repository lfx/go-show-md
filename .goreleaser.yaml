version: 2
project_name: go-show-md

builds:
  - id: default
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    binary: go-show-md

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - templates/**/*
      - static/**/*
      - README.md
      - LICENSE

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'

# Automatically generate a release on GitHub
release:
  github:
    owner: ""
    name: ""
  prerelease: auto

# Automatically update the Homebrew formula in the tap repository
brews:
  - repository:
      owner: lfx
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

    # The directory inside the tap repository
    directory: Formula

    # Metadata
    description: "Lightweight macOS markdown file viewer and navigator"
    homepage: "https://github.com/lfx/go-show-md"

    # Custom test instructions
    test: |
      assert_path_exists bin/"go-show-md"
      assert_predicate bin/"go-show-md", :executable?

    service: |
      run opt_bin/"go-show-md"
      keep_alive true
      working_dir opt_bin
